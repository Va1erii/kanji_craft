<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Review</title>
<style>
:root {
  --bg: #1a1a2e;
  --surface: #16213e;
  --card: #0f3460;
  --accent: #e94560;
  --text: #eee;
  --muted: #999;
  --border: #2a2a4a;
  --input-bg: #1a1a3e;
  --empty-bg: #3a3520;
  --changed-bg: #1a3a2e;
  --tab-active: #e94560;
  --tab-inactive: #2a2a4a;
  --success: #4ade80;
  --error: #f87171;
  --lang-en: #3b82f6;
  --lang-es: #f59e0b;
  --lang-ru: #8b5cf6;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
header h1 { font-size: 18px; font-weight: 600; }
.badge {
  background: var(--accent);
  color: white;
  border-radius: 12px;
  padding: 2px 10px;
  font-size: 13px;
  font-weight: 600;
  min-width: 24px;
  text-align: center;
}
.badge.zero { background: var(--tab-inactive); }
.spacer { flex: 1; }
button {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 6px;
  padding: 8px 16px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
}
button:hover { opacity: 0.9; }
button:disabled { opacity: 0.5; cursor: default; }
button.secondary {
  background: var(--tab-inactive);
}
.tabs {
  display: flex;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  gap: 4px;
}
.tab {
  padding: 10px 20px;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  font-size: 14px;
  color: var(--muted);
  transition: all 0.15s;
  user-select: none;
}
.tab:hover { color: var(--text); }
.tab.active {
  color: var(--text);
  border-bottom-color: var(--tab-active);
}
.tab .count {
  font-size: 12px;
  color: var(--muted);
  margin-left: 4px;
}
.search-bar {
  padding: 12px 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.search-bar input {
  width: 100%;
  max-width: 500px;
  background: var(--input-bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 14px;
  outline: none;
}
.search-bar input:focus { border-color: var(--accent); }
.cards {
  padding: 16px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  max-width: 1200px;
}
.card {
  background: var(--card);
  border-radius: 10px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.card.hidden { display: none; }
.card-header {
  padding: 14px 18px;
  display: flex;
  align-items: baseline;
  gap: 16px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
}
.card-header .symbol {
  font-size: 28px;
  font-weight: 700;
}
.card-header .meta {
  font-size: 13px;
  color: var(--muted);
}
.card-header .readings {
  font-size: 14px;
}
.card-header .readings .on { color: #f87171; }
.card-header .readings .kun { color: #4ade80; }
.card-header .components {
  font-size: 13px;
  color: var(--muted);
}
.lang-section {
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
}
.lang-section:last-child { border-bottom: none; }
.lang-label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
  padding: 2px 8px;
  border-radius: 3px;
  display: inline-block;
}
.lang-label.en { background: var(--lang-en); }
.lang-label.es { background: var(--lang-es); color: #000; }
.lang-label.ru { background: var(--lang-ru); }
.field-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 6px;
}
.field-row label {
  min-width: 120px;
  font-size: 12px;
  color: var(--muted);
  padding-top: 6px;
  text-align: right;
  flex-shrink: 0;
}
.field-row input,
.field-row textarea {
  flex: 1;
  background: var(--input-bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 6px 10px;
  border-radius: 4px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  resize: vertical;
}
.field-row input:focus,
.field-row textarea:focus { border-color: var(--accent); }
.field-row input.empty,
.field-row textarea.empty { background: var(--empty-bg); }
.field-row input.changed,
.field-row textarea.changed { background: var(--changed-bg); border-color: var(--success); }
textarea { min-height: 60px; }
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  z-index: 200;
  animation: fadeIn 0.2s;
  max-width: 400px;
}
.toast.success { background: #065f46; color: var(--success); }
.toast.error { background: #7f1d1d; color: var(--error); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

/* Review changes panel */
.review-panel {
  display: none;
  position: fixed;
  top: 0;
  right: 0;
  width: 500px;
  height: 100vh;
  background: var(--surface);
  border-left: 2px solid var(--accent);
  z-index: 150;
  overflow-y: auto;
  box-shadow: -4px 0 20px rgba(0, 0, 0, 0.5);
}
.review-panel.open { display: block; }
.review-panel-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--surface);
  z-index: 1;
}
.review-panel-header h2 { font-size: 16px; }
.review-panel-body { padding: 16px 20px; }
.diff-group { margin-bottom: 16px; }
.diff-group h3 {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.diff-item {
  background: var(--card);
  border-radius: 6px;
  padding: 10px 12px;
  margin-bottom: 8px;
  font-size: 13px;
}
.diff-item .diff-key { color: var(--muted); margin-bottom: 4px; }
.diff-item .diff-field { font-weight: 600; color: var(--accent); }
.diff-item .diff-before { color: #f87171; text-decoration: line-through; }
.diff-item .diff-after { color: var(--success); }
.diff-empty { color: var(--muted); font-style: italic; padding: 20px; text-align: center; }

/* Warnings */
.warnings {
  padding: 8px 18px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.warning-item {
  font-size: 13px;
  padding: 6px 10px;
  border-radius: 4px;
  border-left: 3px solid;
}
.warning-item.high {
  background: rgba(248, 113, 113, 0.15);
  border-left-color: #f87171;
  color: #fca5a5;
}
.warning-item.medium {
  background: rgba(251, 191, 36, 0.15);
  border-left-color: #fbbf24;
  color: #fde68a;
}
.warning-item.low {
  background: rgba(148, 163, 184, 0.1);
  border-left-color: #64748b;
  color: var(--muted);
}
.warning-item .warning-severity {
  font-weight: 700;
  text-transform: uppercase;
  font-size: 11px;
  margin-right: 6px;
}
.card.has-warnings { border-color: #f59e0b; }

/* ── Kanji list view ───────────────────────────────────────────────────────── */
.kanji-list {
  padding: 0 24px 24px;
  max-width: 1400px;
}
.kanji-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.kanji-table th {
  position: sticky;
  top: 0;
  background: var(--surface);
  text-align: left;
  padding: 10px 12px;
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
  z-index: 10;
}
.kanji-table th:first-child { width: 50px; text-align: center; }
.kanji-row {
  cursor: pointer;
  transition: background 0.1s;
}
.kanji-row:hover { background: rgba(255,255,255,0.03); }
.kanji-row td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
.kanji-row td:first-child {
  font-size: 28px;
  font-weight: 700;
  text-align: center;
  width: 50px;
  line-height: 1;
  padding-top: 10px;
}
.kanji-row .kr-meta {
  font-size: 12px;
  color: var(--muted);
}
.kanji-row .kr-on { color: #f87171; }
.kanji-row .kr-kun { color: #4ade80; }
.kanji-row .kr-comp {
  font-size: 13px;
  color: var(--muted);
}
.kanji-row .kr-comp .comp-symbol {
  color: var(--text);
  font-size: 15px;
}
.kanji-row .kr-meanings {
  color: var(--text);
  font-size: 13px;
}
.kanji-row .kr-warn-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-left: 4px;
  vertical-align: middle;
}
.kanji-row .kr-warn-dot.high { background: #f87171; }
.kanji-row .kr-warn-dot.medium { background: #fbbf24; }
.kanji-row .kr-warn-dot.low { background: #64748b; }
.kanji-row.expanded { background: rgba(233,69,96,0.05); }
.kanji-row.has-warnings td:first-child {
  border-left: 3px solid #f59e0b;
  padding-left: 9px;
}
.kanji-detail {
  display: none;
}
.kanji-detail.open {
  display: table-row;
}
.kanji-detail td {
  padding: 0;
  border-bottom: 2px solid var(--accent);
}
.kanji-detail-inner {
  padding: 12px 18px 16px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  background: var(--card);
}
.kanji-detail-inner .lang-section {
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
}
.kanji-detail-inner .lang-section:last-child { border-bottom: 1px solid var(--border); }
.kanji-detail .warnings {
  grid-column: 1 / -1;
  padding: 0;
  margin-bottom: 4px;
}
</style>
</head>
<body>

<header>
  <h1 id="batchTitle">Batch Review</h1>
  <span class="badge zero" id="changeBadge">0</span>
  <span style="font-size:13px;color:var(--muted)">changes</span>
  <div class="spacer"></div>
  <button class="secondary" id="btnReview" onclick="toggleReviewPanel()">Review Changes</button>
  <button id="btnSave" onclick="saveChanges()" disabled>Save</button>
</header>

<div class="tabs" id="tabBar">
  <div class="tab active" data-tab="radicals" onclick="switchTab('radicals')">Radicals <span class="count" id="countRadicals"></span></div>
  <div class="tab" data-tab="kanji" onclick="switchTab('kanji')">Kanji <span class="count" id="countKanji"></span></div>
  <div class="tab" data-tab="vocabulary" onclick="switchTab('vocabulary')">Vocabulary <span class="count" id="countVocabulary"></span></div>
  <div class="tab" data-tab="sentences" onclick="switchTab('sentences')">Sentences <span class="count" id="countSentences"></span></div>
</div>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="Search by symbol, word, name, meaning..." oninput="filterCards()">
</div>

<div id="cardContainer"></div>

<div class="review-panel" id="reviewPanel">
  <div class="review-panel-header">
    <h2>Pending Changes</h2>
    <button class="secondary" onclick="toggleReviewPanel()" style="padding:4px 12px;font-size:13px;">Close</button>
  </div>
  <div class="review-panel-body" id="reviewPanelBody"></div>
</div>

<script>
const BATCH_DATA = {{ batch_data_json|safe }};
const LANGS = ["en", "es", "ru"];
let activeTab = "radicals";
let pendingChanges = {};  // { "table_name": [ {key: {...}, fields: {...}} ] }
let originalData = {};    // { "table:keyJson:field" => originalValue }

// ── Init ────────────────────────────────────────────────────────────────────

document.getElementById("batchTitle").textContent = BATCH_DATA.batch_name || "Batch Review";
document.getElementById("countRadicals").textContent = `(${BATCH_DATA.radicals.length})`;
document.getElementById("countKanji").textContent = `(${BATCH_DATA.kanji.length})`;
document.getElementById("countVocabulary").textContent = `(${BATCH_DATA.vocabulary.length})`;
document.getElementById("countSentences").textContent = `(${BATCH_DATA.sentences.length})`;

renderAllCards();
showTab("radicals");

// ── Tab switching ───────────────────────────────────────────────────────────

function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll(".tab").forEach(t => {
    t.classList.toggle("active", t.dataset.tab === tab);
  });
  showTab(tab);
  filterCards();
}

function showTab(tab) {
  document.querySelectorAll(".cards, .kanji-list").forEach(c => {
    c.style.display = c.dataset.tab === tab ? (c.classList.contains("kanji-list") ? "block" : "flex") : "none";
  });
}

// ── Rendering ───────────────────────────────────────────────────────────────

function renderAllCards() {
  const container = document.getElementById("cardContainer");
  container.innerHTML = "";

  container.appendChild(renderCardGroup("radicals", BATCH_DATA.radicals, renderRadicalCard));
  container.appendChild(renderKanjiTable(BATCH_DATA.kanji));
  container.appendChild(renderCardGroup("vocabulary", BATCH_DATA.vocabulary, renderVocabCard));
  container.appendChild(renderCardGroup("sentences", BATCH_DATA.sentences, renderSentenceCard));
}

function renderCardGroup(tab, items, renderFn) {
  const wrap = document.createElement("div");
  wrap.className = "cards";
  wrap.dataset.tab = tab;
  items.forEach((item, idx) => wrap.appendChild(renderFn(item, idx)));
  return wrap;
}

function renderRadicalCard(item) {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.search = [
    item.master_symbol, item.family_symbol,
    ...LANGS.flatMap(l => [item.i18n[l]?.name || "", item.i18n[l]?.system_mnemonic || ""])
  ].join(" ").toLowerCase();

  let posDisplay = item.positions;
  try { posDisplay = JSON.parse(item.positions).join(", "); } catch {}

  card.innerHTML = `
    <div class="card-header">
      <span class="symbol">${esc(item.master_symbol)}</span>
      <span class="meta">strokes: ${esc(item.stroke_count)}</span>
      <span class="meta">official: ${item.is_official === "True" ? "Yes" : "No"}</span>
      <span class="meta">positions: ${esc(posDisplay)}</span>
      ${item.family_symbol ? `<span class="meta">family: ${esc(item.family_symbol)}</span>` : ""}
    </div>
  `;

  const warnEl = renderWarnings(item.warnings);
  if (warnEl) { card.appendChild(warnEl); card.classList.add("has-warnings"); }

  LANGS.forEach(lang => {
    const i = item.i18n[lang] || {};
    card.appendChild(langSection(lang, [
      fieldRow("Name", "radical_i18n", {master_symbol: item.master_symbol, lang_code: lang}, "name", i.name, "input"),
      fieldRow("Mnemonic", "radical_i18n", {master_symbol: item.master_symbol, lang_code: lang}, "system_mnemonic", i.system_mnemonic, "textarea"),
      fieldRow("Tags", "radical_i18n", {master_symbol: item.master_symbol, lang_code: lang}, "search_tags", i.search_tags, "input"),
      fieldRow("Disambiguation", "radical_i18n", {master_symbol: item.master_symbol, lang_code: lang}, "disambiguation_note", i.disambiguation_note, "input"),
    ]));
  });
  return card;
}

function renderKanjiCard(item) {
  // Not used — kanji uses table layout via renderKanjiTable()
  return document.createElement("div");
}

function renderKanjiTable(items) {
  const wrap = document.createElement("div");
  wrap.className = "kanji-list";
  wrap.dataset.tab = "kanji";

  const table = document.createElement("table");
  table.className = "kanji-table";
  table.innerHTML = `<thead><tr>
    <th>Char</th>
    <th>Strokes</th>
    <th>Rank</th>
    <th>ON</th>
    <th>KUN</th>
    <th>Components</th>
    <th>EN Meanings</th>
    <th></th>
  </tr></thead>`;

  const tbody = document.createElement("tbody");
  items.forEach(item => {
    const onReadings = item.readings.filter(r => r.reading_type === "onyomi").map(r => r.reading);
    const kunReadings = item.readings.filter(r => r.reading_type === "kunyomi").map(r => r.reading);

    const compHtml = (item.components || []).map(c => {
      const meta = [c.position, c.logic_hint].filter(Boolean).join(",");
      return `<span class="comp-symbol">${esc(c.master_symbol)}</span><span style="font-size:11px">${meta ? `(${esc(meta)})` : ""}</span>`;
    }).join(" ");

    let enMeanings = "";
    try { enMeanings = JSON.parse(item.i18n.en?.meanings || "[]").join(", "); } catch { enMeanings = item.i18n.en?.meanings || ""; }

    // Warning dot
    let warnDots = "";
    if (item.warnings && item.warnings.length > 0) {
      const highest = item.warnings.reduce((h, w) => {
        const order = {high: 0, medium: 1, low: 2};
        return (order[w.severity] ?? 3) < (order[h] ?? 3) ? w.severity : h;
      }, "low");
      warnDots = `<span class="kr-warn-dot ${highest}" title="${item.warnings.length} warning(s)"></span>`;
    }

    const searchStr = [
      item.character,
      ...item.readings.map(r => r.reading),
      ...(item.components || []).map(c => c.master_symbol),
      ...LANGS.flatMap(l => [item.i18n[l]?.meanings || "", item.i18n[l]?.system_mnemonic || ""])
    ].join(" ").toLowerCase();

    // Summary row
    const row = document.createElement("tr");
    row.className = "kanji-row" + (item.warnings?.length ? " has-warnings" : "");
    row.dataset.search = searchStr;
    row.innerHTML = `
      <td>${esc(item.character)}${warnDots}</td>
      <td class="kr-meta">${esc(item.stroke_count)}</td>
      <td class="kr-meta">#${esc(item.frequency_rank)}</td>
      <td class="kr-on">${esc(onReadings.join(", "))}</td>
      <td class="kr-kun">${esc(kunReadings.join(", "))}</td>
      <td class="kr-comp">${compHtml}</td>
      <td class="kr-meanings">${esc(enMeanings)}</td>
      <td class="kr-meta" style="font-size:11px;cursor:pointer;user-select:none;">▶</td>
    `;

    // Detail row (hidden until clicked)
    const detailRow = document.createElement("tr");
    detailRow.className = "kanji-detail";
    const detailTd = document.createElement("td");
    detailTd.colSpan = 8;

    const inner = document.createElement("div");
    inner.className = "kanji-detail-inner";

    // Warnings in detail
    if (item.warnings && item.warnings.length > 0) {
      const warnEl = renderWarnings(item.warnings);
      if (warnEl) { warnEl.classList.add("warnings"); inner.appendChild(warnEl); }
    }

    LANGS.forEach(lang => {
      const i = item.i18n[lang] || {};
      inner.appendChild(langSection(lang, [
        fieldRow("Meanings", "kanji_i18n", {character: item.character, lang_code: lang}, "meanings", i.meanings, "input"),
        fieldRow("Mnemonic", "kanji_i18n", {character: item.character, lang_code: lang}, "system_mnemonic", i.system_mnemonic, "textarea"),
        fieldRow("Tags", "kanji_i18n", {character: item.character, lang_code: lang}, "search_tags", i.search_tags, "input"),
      ]));
    });

    detailTd.appendChild(inner);
    detailRow.appendChild(detailTd);

    // Toggle detail on row click
    row.addEventListener("click", (e) => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      const isOpen = detailRow.classList.toggle("open");
      row.classList.toggle("expanded", isOpen);
      row.querySelector("td:last-child").textContent = isOpen ? "▼" : "▶";
    });

    tbody.appendChild(row);
    tbody.appendChild(detailRow);
  });

  table.appendChild(tbody);
  wrap.appendChild(table);
  return wrap;
}

function renderVocabCard(item) {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.search = [
    item.word, item.furigana, item.id,
    ...LANGS.flatMap(l => [item.i18n[l]?.meanings || "", item.i18n[l]?.system_mnemonic || ""])
  ].join(" ").toLowerCase();

  card.innerHTML = `
    <div class="card-header">
      <span class="symbol">${esc(item.word)}</span>
      <span class="meta">${esc(item.furigana)}</span>
      <span class="meta">rank: #${esc(item.frequency_rank)}</span>
      <span class="meta" style="color:var(--muted);font-size:12px">id: ${esc(item.id)}</span>
    </div>
  `;

  LANGS.forEach(lang => {
    const i = item.i18n[lang] || {};
    card.appendChild(langSection(lang, [
      fieldRow("Meanings", "vocabulary_i18n", {vocabulary_id: item.id, lang_code: lang}, "meanings", i.meanings, "input"),
      fieldRow("Mnemonic", "vocabulary_i18n", {vocabulary_id: item.id, lang_code: lang}, "system_mnemonic", i.system_mnemonic, "textarea"),
      fieldRow("Tags", "vocabulary_i18n", {vocabulary_id: item.id, lang_code: lang}, "search_tags", i.search_tags, "input"),
    ]));
  });
  return card;
}

function renderSentenceCard(item) {
  const card = document.createElement("div");
  card.className = "card";
  card.dataset.search = [
    item.word, item.vocabulary_id, item.original_text,
    ...LANGS.map(l => item.i18n[l]?.sentence_translated || "")
  ].join(" ").toLowerCase();

  card.innerHTML = `
    <div class="card-header">
      <span class="symbol">${esc(item.word)}</span>
      <span class="meta" style="color:var(--muted);font-size:12px">vocab_id: ${esc(item.vocabulary_id)}</span>
    </div>
  `;

  // original_text is editable on vocabulary_sentences table
  const otSection = document.createElement("div");
  otSection.className = "lang-section";
  otSection.appendChild(
    fieldRow("Original text", "vocabulary_sentences", {vocabulary_id: item.vocabulary_id}, "original_text", item.original_text, "input")
  );
  card.appendChild(otSection);

  LANGS.forEach(lang => {
    const i = item.i18n[lang] || {};
    card.appendChild(langSection(lang, [
      fieldRow("Translation", "vocabulary_sentence_i18n", {vocabulary_id: item.vocabulary_id, lang_code: lang}, "sentence_translated", i.sentence_translated, "textarea"),
    ]));
  });
  return card;
}

// ── UI Helpers ──────────────────────────────────────────────────────────────

function renderWarnings(warnings) {
  if (!warnings || warnings.length === 0) return null;
  const div = document.createElement("div");
  div.className = "warnings";
  // Sort: high first, then medium, then low
  const order = {high: 0, medium: 1, low: 2};
  const sorted = [...warnings].sort((a, b) => (order[a.severity] ?? 3) - (order[b.severity] ?? 3));
  for (const w of sorted) {
    const item = document.createElement("div");
    item.className = `warning-item ${w.severity}`;
    item.innerHTML = `<span class="warning-severity">${esc(w.severity)}</span>${esc(w.message)}`;
    div.appendChild(item);
  }
  return div;
}

function langSection(lang, fieldElements) {
  const div = document.createElement("div");
  div.className = "lang-section";
  div.innerHTML = `<div class="lang-label ${lang}">${lang.toUpperCase()}</div>`;
  fieldElements.forEach(el => div.appendChild(el));
  return div;
}

function fieldRow(label, table, key, field, value, type) {
  const row = document.createElement("div");
  row.className = "field-row";

  const lbl = document.createElement("label");
  lbl.textContent = label;
  row.appendChild(lbl);

  const origKey = `${table}:${JSON.stringify(key)}:${field}`;
  originalData[origKey] = value || "";

  let input;
  if (type === "textarea") {
    input = document.createElement("textarea");
    input.rows = 2;
  } else {
    input = document.createElement("input");
    input.type = "text";
  }
  input.value = value || "";
  input.dataset.table = table;
  input.dataset.key = JSON.stringify(key);
  input.dataset.field = field;
  input.dataset.origKey = origKey;

  if (!value || value === "" || value === "[]") {
    input.classList.add("empty");
  }

  input.addEventListener("input", function() {
    const orig = originalData[this.dataset.origKey];
    const current = this.value;
    const isChanged = current !== orig;

    this.classList.toggle("changed", isChanged);
    this.classList.toggle("empty", !current || current === "[]");

    trackChange(this.dataset.table, JSON.parse(this.dataset.key), this.dataset.field, orig, current);
  });

  row.appendChild(input);
  return row;
}

function esc(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

// ── Change tracking ─────────────────────────────────────────────────────────

function trackChange(table, key, field, original, current) {
  if (!pendingChanges[table]) pendingChanges[table] = {};

  const keyStr = JSON.stringify(key);
  if (!pendingChanges[table][keyStr]) {
    pendingChanges[table][keyStr] = { key, fields: {}, originals: {} };
  }

  const entry = pendingChanges[table][keyStr];
  if (current !== original) {
    entry.fields[field] = current;
    entry.originals[field] = original;
  } else {
    delete entry.fields[field];
    delete entry.originals[field];
  }

  // Clean up empty entries
  if (Object.keys(entry.fields).length === 0) {
    delete pendingChanges[table][keyStr];
    if (Object.keys(pendingChanges[table]).length === 0) {
      delete pendingChanges[table];
    }
  }

  updateBadge();
}

function updateBadge() {
  let count = 0;
  for (const table of Object.values(pendingChanges)) {
    for (const entry of Object.values(table)) {
      count += Object.keys(entry.fields).length;
    }
  }
  const badge = document.getElementById("changeBadge");
  badge.textContent = count;
  badge.classList.toggle("zero", count === 0);
  document.getElementById("btnSave").disabled = count === 0;
}

// ── Search / filter ─────────────────────────────────────────────────────────

function filterCards() {
  const q = document.getElementById("searchInput").value.toLowerCase().trim();

  // Card-based tabs (radicals, vocabulary, sentences)
  const cardContainer = document.querySelector(`.cards[data-tab="${activeTab}"]`);
  if (cardContainer) {
    cardContainer.querySelectorAll(".card").forEach(card => {
      if (!q) {
        card.classList.remove("hidden");
      } else {
        const match = (card.dataset.search || "").includes(q);
        card.classList.toggle("hidden", !match);
      }
    });
  }

  // Kanji table rows
  if (activeTab === "kanji") {
    document.querySelectorAll(".kanji-row").forEach(row => {
      const detail = row.nextElementSibling;
      if (!q) {
        row.style.display = "";
        if (detail?.classList.contains("kanji-detail")) detail.style.display = "";
      } else {
        const match = (row.dataset.search || "").includes(q);
        row.style.display = match ? "" : "none";
        if (detail?.classList.contains("kanji-detail")) detail.style.display = match ? "" : "none";
      }
    });
  }
}

// ── Review panel ────────────────────────────────────────────────────────────

function toggleReviewPanel() {
  const panel = document.getElementById("reviewPanel");
  const isOpen = panel.classList.toggle("open");
  if (isOpen) renderReviewPanel();
}

function renderReviewPanel() {
  const body = document.getElementById("reviewPanelBody");
  const tables = Object.keys(pendingChanges);

  if (tables.length === 0) {
    body.innerHTML = '<div class="diff-empty">No changes yet</div>';
    return;
  }

  let html = "";
  for (const table of tables) {
    html += `<div class="diff-group"><h3>${esc(table)}</h3>`;
    for (const entry of Object.values(pendingChanges[table])) {
      const keyDisplay = Object.entries(entry.key).map(([k, v]) => `${k}=${v}`).join(", ");
      for (const [field, newVal] of Object.entries(entry.fields)) {
        const oldVal = entry.originals[field] || "";
        html += `
          <div class="diff-item">
            <div class="diff-key">${esc(keyDisplay)}</div>
            <div class="diff-field">${esc(field)}</div>
            <div class="diff-before">${esc(truncate(oldVal, 100)) || "(empty)"}</div>
            <div class="diff-after">${esc(truncate(newVal, 100)) || "(empty)"}</div>
          </div>
        `;
      }
    }
    html += "</div>";
  }
  body.innerHTML = html;
}

function truncate(str, max) {
  return str && str.length > max ? str.slice(0, max) + "..." : str;
}

// ── Save ────────────────────────────────────────────────────────────────────

async function saveChanges() {
  const btn = document.getElementById("btnSave");
  btn.disabled = true;
  btn.textContent = "Saving...";

  // Build changeset in the expected format
  const changes = {};
  for (const [table, entries] of Object.entries(pendingChanges)) {
    changes[table] = Object.values(entries).map(e => ({
      key: e.key,
      fields: e.fields,
    }));
  }

  try {
    const resp = await fetch("/api/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ changes }),
    });
    const data = await resp.json();
    if (resp.ok) {
      showToast("Saved changes.json successfully", "success");
    } else {
      showToast("Error: " + (data.error || "Unknown error"), "error");
    }
  } catch (err) {
    showToast("Network error: " + err.message, "error");
  } finally {
    btn.disabled = Object.keys(pendingChanges).length === 0;
    btn.textContent = "Save";
  }
}

function showToast(msg, type) {
  const existing = document.querySelector(".toast");
  if (existing) existing.remove();

  const toast = document.createElement("div");
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3500);
}
</script>
